<!DOCTYPE html>
<html>
<head>
<style>
.star-border-container {
  display: flex;
  position: relative;
  border-radius: 16px;
  width: 400px;
  height: 300px;
  background: #111;
  padding: 3px;
  margin: 50px;
}
.border-gradient-wrapper {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  overflow: hidden;
  padding: 3px;
  -webkit-mask-image: linear-gradient(#fff 0 0), linear-gradient(#fff 0 0);
  -webkit-mask-clip: content-box, border-box;
  -webkit-mask-composite: destination-out;
  mask-image: linear-gradient(#fff 0 0), linear-gradient(#fff 0 0);
  mask-clip: content-box, border-box;
  mask-composite: exclude;
  z-index: 0;
}
.border-gradient-bottom {
  position: absolute;
  width: 300%;
  height: 50%;
  opacity: 0.7;
  bottom: -12px;
  right: -250%;
  border-radius: 50%;
  animation: star-movement-bottom 6s linear infinite alternate;
  background: radial-gradient(circle, #06B6D4, transparent 20%);
}
.border-gradient-top {
  position: absolute;
  width: 300%;
  height: 50%;
  opacity: 0.7;
  top: -12px;
  left: -250%;
  border-radius: 50%;
  animation: star-movement-top 6s linear infinite alternate;
  background: radial-gradient(circle, #06B6D4, transparent 20%);
}
@keyframes star-movement-bottom {
  0% { transform: translate(0%, 0%); opacity: 1; }
  100% { transform: translate(-100%, 0%); opacity: 0; }
}
@keyframes star-movement-top {
  0% { transform: translate(0%, 0%); opacity: 1; }
  100% { transform: translate(100%, 0%); opacity: 0; }
}
.inner-content {
  position: relative;
  width: 100%;
  height: 100%;
  border-radius: 16px;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(12px);
  z-index: 1;
}
</style>
</head>
<body>
<div class="star-border-container">
  <div class="border-gradient-wrapper">
    <div class="border-gradient-bottom"></div>
    <div class="border-gradient-top"></div>
  </div>
  <div class="inner-content">
    Testing
  </div>
</div>
</body>
</html>
